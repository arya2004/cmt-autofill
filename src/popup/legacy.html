<h1>CMT Author Auto-Fill</h1>

<fieldset id="profileControls">
  <legend>Profiles</legend>
  <label for="profileSelect">Active profile</label>
  <select id="profileSelect"></select>
  <label for="profileName">Profile name</label>
  <input
    id="profileName"
    type="text"
    maxlength="80"
    placeholder="Profile name"
  />
  <div class="button-group">
    <button type="button" id="createProfile">Create</button>
    <button type="button" id="renameProfile">Rename</button>
    <button type="button" id="deleteProfile">Delete</button>
  </div>
</fieldset>
<p id="status" role="status" aria-live="polite"></p>
<button type="button" id="retryLoad" hidden>Retry loading profiles</button>
<button type="button" id="autoFillAuthors">Fill Authors</button>

<form id="authorForm">
  <div id="authorFields"></div>
  <div class="button-group">
    <button type="button" id="addAuthor">Add Author</button>
    <button type="button" id="saveAuthors">Save Authors</button>
  </div>
</form>

<template id="authorTemplate">
  <div class="author">
    <div class="author-header">
      <h2>Author <span class="author-number"></span></h2>
      <button type="button" class="remove-author">Remove</button>
    </div>
    <label>Email:</label>
    <input type="email" class="author-email" placeholder="Email" />
    <label>First Name:</label>
    <input type="text" class="author-name" placeholder="First Name" />
    <label>Last Name:</label>
    <input type="text" class="author-surname" placeholder="Last Name" />
    <label>Organization:</label>
    <input type="text" class="author-organization" placeholder="Organization" />
    <label>Country:</label>
    <select class="author-country"></select>
  </div>
</template>
